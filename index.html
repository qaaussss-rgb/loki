<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Scripts & Injectors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Кнопки переключения вкладок -->
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('scripts')">Скрипты на Roblox</button>
            <button class="tab-btn" onclick="openTab('injectors')">Инжектор Real</button>
        </div>

        <!-- Содержимое вкладки со Скриптами -->
        <div id="scripts" class="tab-content active">
            <h2>Скрипты для Roblox</h2>
            
            <!-- Карточка Stellar Hub -->
            <div class="script-card">
                <h3>Stellar Hub</h3>
                <p>Популярный многофункциональный скрипт.</p>
                <button class="copy-btn" onclick="copyScript('stellar')">Копировать скрипт Stellar Hub</button>
            </div>

            <!-- Карточка Rivals -->
            <div class="script-card">
                <h3>Kiciahook (Rivals)</h3>
                <p>Актуальный и мощный скрипт для режима Rivals.</p>
                <button class="copy-btn" onclick="copyScript('rivals')">Копировать скрипт Rivals</button>
            </div>
        </div>

        <!-- Содержимое вкладки с Инжектором -->
        <div id="injectors" class="tab-content">
            <h2>Инжекторы</h2>
            <div class="script-card">
                <h3>Real Injector</h3>
                <p>Нажмите ниже, чтобы перейти на официальный сайт инжектора и скачать его.</p>
                <a href="https://projectreal.gg" target="_blank" class="download-link">
                    <button class="copy-btn">Перейти на сайт Real Injector</button>
                </a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
